name: pltv-env
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10

  # Core Data Science Libraries
  - pandas>=1.5.0
  - numpy>=1.21.0
  - scipy>=1.9.0

  # Machine Learning Libraries
  - scikit-learn>=1.2.0
  - lightgbm>=3.3.0  # This will properly install with OpenMP support
  - xgboost>=1.6.0

  # Visualization Libraries
  - matplotlib>=3.6.0
  - seaborn>=0.12.0
  - plotly>=5.11.0

  # Data Processing & Utilities
  - pyarrow>=10.0.0
  - openpyxl>=3.0.0
  - xlsxwriter>=3.0.0

  # Statistical Libraries
  - statsmodels>=0.13.0

  # Progress Bars & Utilities
  - tqdm>=4.64.0

  # Date/Time Handling
  - python-dateutil>=2.8.0

  # JSON & Configuration
  - jsonschema>=4.17.0

  # OpenMP for LightGBM (macOS specific)
  - llvm-openmp

  # Optional: Jupyter Notebook Support
  - jupyter>=1.0.0
  - ipykernel>=6.19.0
  - ipywidgets>=8.0.0

  # Pip dependencies (for packages not available in conda)
  - pip
  - pip:
    # Google Cloud Libraries (better installed via pip)
    - google-cloud-bigquery>=3.4.0
    - google-auth>=2.15.0
    - google-auth-oauthlib>=0.8.0
    - google-auth-httplib2>=0.1.0
    - google-cloud-core>=2.3.0
    
    # Optional: Advanced Visualization
    - bokeh>=2.4.0
    - altair>=4.2.0
    
    # Development Tools (optional)
    - black>=22.12.0
    - flake8>=6.0.0
    - mypy>=0.991